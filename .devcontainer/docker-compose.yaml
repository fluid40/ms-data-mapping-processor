services:
  opcua_press_mockup:
    image: engineeringmethodsag/fluid-opcua-press-mockup:latest
    container_name: opcua-press-mockup

  asset_connector:
    image: engineeringmethodsag/fluid-asset-connector-python:latest
    container_name: ms-asset-connector
    depends_on:
        - opcua_press_mockup

  influx_database_v1:
    image: influxdb:1.11.8
    container_name: influx-database
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: always
    environment:
      INFLUXDB_DB: submodel-db
      INFLUXDB_ADMIN_USER: admin
      INFLUXDB_ADMIN_PASSWORD: fluid40secure!
      INFLUXDB_USER: fluid40
      INFLUXDB_USER_PASSWORD: wbEx!S!#4OHcN!5X
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "8076:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fluid40
    depends_on:
        influx_database_v1:
          condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  java_aas_server:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-08
    container_name: aas-server
    ports:
      - '8077:8077'
    environment:
      - SERVER_PORT=8077
      - SERVER_HOST=runt
    volumes:
      - ./aas:/application/aas
      - ./basyx/aas-env.properties:/application/application.properties

  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    container_name: aas-web-ui
    ports:
      - '8078:3000'
    environment:
      AAS_REGISTRY_PATH:
      SUBMODEL_REGISTRY_PATH:
      AAS_REPO_PATH: http://localhost:8077/shells
      SUBMODEL_REPO_PATH: http://localhost:8077/submodels
      CD_REPO_PATH: http://localhost:8077/concept-descriptions
      PRIMARY_COLOR: '#00A0C7'
      LOGO_LIGHT_PATH: fluid40_light.png
      LOGO_DARK_PATH: fluid40_dark.png
      DASHBOARD_SERVICE_PATH:
    volumes:
      - ./logo:/usr/src/app/dist/Logo
    depends_on:
      java_aas_server :
        condition: service_healthy

  dev_container:
    build: .
    container_name: ms-dev-container
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
        java_aas_server:
          condition: service_healthy
        asset_connector:
          condition: service_started
        influx_database_v1:
          condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - RUNTIME_OAUTH_SECRET=nY0mjyECF60DGzNmQUjL81XurSl8etom
      - RUNTIME_CONFIGURATION_FILE=./configuration/DevContainerEnv.json

volumes:
  influxdb_data:
  grafana_data:
