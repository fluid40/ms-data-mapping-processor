name: Build Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  detect-project-changes:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if pyproject.toml changed
        id: check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES="$(git diff --name-only HEAD^ HEAD)"
          else
            echo "No parent commit found, using full file list"
            CHANGED_FILES="$(git ls-files)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q '^pyproject\.toml$'; then
            echo "pyproject.toml changed, marking as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pyproject.toml not changed, skipping release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  Run_Tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v tests/*.py

  docker-build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
