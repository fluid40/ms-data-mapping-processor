name: Build Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-project-changes:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check if pyproject.toml changed
        id: check
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED_FILES="$(git diff --name-only HEAD^ HEAD)"
          else
            echo "No parent commit found, using full file list"
            CHANGED_FILES="$(git ls-files)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q '^pyproject\.toml$'; then
            echo "pyproject.toml changed, marking as changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pyproject.toml not changed, skipping release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v tests/*.py

  docker-build:
    name: Build and Push Docker Image
    needs: [detect-project-changes, run-tests]
    if: github.ref == 'refs/heads/main' && needs.detect-project-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "Extracted git hash: $GIT_HASH"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        with:
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            engineeringmethodsag/ms-data-mapping-processor:${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.hash }}
            engineeringmethodsag/ms-data-mapping-processor:latest

  release-data:
    name: Create Release Data
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "Extracted git hash: $GIT_HASH"

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: .github/changelog-config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag
        run: |
          VERSION_TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists."
          else
            git tag "$VERSION_TAG"
            git push origin "$VERSION_TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 🚀 Release v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          body: |
            ## 📝 Release Notes

            **Version:** v${{ steps.get_version.outputs.version }}
            **Commit:** `${{ steps.get_version.outputs.hash }}`

            ### 🧩 Build Information
            - Docker Image: [`engineeringmethodsag/ms-data-mapping-processor:latest`](https://hub.docker.com/repository/docker/engineeringmethodsag/ms-data-mapping-processor/general)
            - [Changelog](docs/CHANGELOG.md)
            - [Documentation](https://fluid40.github.io/aas-http-client/)
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
